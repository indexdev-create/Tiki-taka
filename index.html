/* HEADING */
.epic-title {
    width: 100%;
    margin: 15px auto 32px;

    font-family: 'DM Serif Display', serif;
    font-size: clamp(38px, 9.5vw, 56px);
    font-weight: 400;
    line-height: 1.15;

    letter-spacing: 1px;

    color: #176b35;

    text-shadow:
        0 2px 10px rgba(35, 110, 55, 0.2);
}

/* LIST CONTAINER */
.epic-list {
    width: 100%;
    max-width: 280px;

    margin: 0 auto;
    padding: 18px 20px;

    border: 2px solid rgba(48, 139, 67, 0.65);
    border-radius: 18px;

    background: rgba(255, 255, 255, 0.35);

    box-shadow:
        0 0 18px rgba(44, 145, 65, 0.28),
        0 8px 30px rgba(34, 105, 48, 0.12);

    backdrop-filter: blur(5px);
    -webkit-backdrop-filter: blur(5px);
}

/* ORDERED LIST */
.epic-list ol {
    margin: 0;
    padding: 0;

    list-style: none;

    counter-reset: epic-counter;
}

/* LIST ITEM */
.epic-list li {
    counter-increment: epic-counter;

    display: flex;
    align-items: center;

    list-style: none;

    margin: 0 0 10px;
    padding: 0;

    transition: transform 0.2s ease;
}

.epic-list li:last-child {
    margin-bottom: 0;
}

/* CLICKABLE LINK */
.epic-list li a {
    display: inline-flex;
    align-items: center;

    padding: 7px 10px;

    color: #205c32;

    font-family: 'Inter', sans-serif;
    font-size: 18px;
    font-weight: 600;

    text-decoration: none;

    border-radius: 8px;

    transition:
        color 0.2s ease,
        background 0.2s ease,
        transform 0.2s ease;
}

/* NUMBER */
.epic-list li a::before {
    content: counter(epic-counter, decimal-leading-zero);

    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;

    width: 30px;
    height: 24px;

    margin-right: 10px;

    font-size: 12px;
    font-weight: 700;

    color: #278044;

    border-right: 1px solid rgba(39, 128, 68, 0.3);
}

/* HOVER */
.epic-list li a:hover {
    color: #08752d;

    background: rgba(65, 170, 83, 0.13);

    transform: translateX(5px);
}

/* TAP */
.epic-list li a:active {
    transform: translateX(5px) scale(0.97);
}

/* LEAF DETAILS — LAST 3 LIST ITEMS ONLY */
.epic-list li:nth-last-child(3)::after,
.epic-list li:nth-last-child(2)::after,
.epic-list li:last-child::after {
    flex-shrink: 0;
    margin-left: 7px;
    font-size: 12px;
}

.epic-list li:nth-last-child(3)::after {
    content: "🍃";
}

.epic-list li:nth-last-child(2)::after {
    content: "🌿";
}

.epic-list li:last-child::after {
    content: "🍃";
}

/* NOTE / PARAGRAPH */
.epic-para {

    border-left: 3px solid rgba(48, 139, 67, 0.65);
    border-radius: 8px;

    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
}
